              - button "Copy to clipboard" [ref=e333] [cursor=pointer]
            - paragraph [ref=e335]: "The plugin function receives:"
            - list [ref=e336]:
              - listitem [ref=e337]:
                - code [ref=e338]: "`project`"
                - text: ": The current project information."
              - listitem [ref=e339]:
                - code [ref=e340]: "`directory`"
                - text: ": The current working directory."
              - listitem [ref=e341]:
                - code [ref=e342]: "`worktree`"
                - text: ": The git worktree path."
              - listitem [ref=e343]:
                - code [ref=e344]: "`client`"
                - text: ": An opencode SDK client for interacting with the AI."
              - listitem [ref=e345]:
                - code [ref=e346]: "`$`"
                - text: ": Bun’s"
                - link "shell API" [ref=e347] [cursor=pointer]:
                  - /url: https://bun.com/docs/runtime/shell
                - text: for executing commands.
            - separator [ref=e348]
            - heading "TypeScript support" [level=3] [ref=e349]:
              - link "TypeScript support" [ref=e350]:
                - /url: "#typescript-support"
            - paragraph [ref=e351]: "For TypeScript plugins, you can import types from the plugin package:"
            - figure "my-plugin.ts" [ref=e353]:
