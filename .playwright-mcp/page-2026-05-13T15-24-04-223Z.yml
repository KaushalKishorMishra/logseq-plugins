      - main [ref=e166]:
        - generic [ref=e168]:
          - heading "Plugins" [level=1] [ref=e169]
          - paragraph [ref=e170]: Write your own plugins to extend OpenCode.
        - generic [ref=e172]:
          - generic [ref=e173]:
            - paragraph [ref=e174]: Plugins allow you to extend OpenCode by hooking into various events and customizing behavior. You can create plugins to add new features, integrate with external services, or modify OpenCode’s default behavior.
            - paragraph [ref=e175]:
              - text: For examples, check out the
              - link "plugins" [ref=e176] [cursor=pointer]:
                - /url: /docs/ecosystem#plugins
              - text: created by the community.
            - separator [ref=e177]
            - heading "Use a plugin" [level=2] [ref=e178]:
              - link "Use a plugin" [ref=e179]:
                - /url: "#use-a-plugin"
            - paragraph [ref=e180]: There are two ways to load plugins.
            - separator [ref=e181]
            - heading "From local files" [level=3] [ref=e182]:
              - link "From local files" [ref=e183]:
                - /url: "#from-local-files"
            - paragraph [ref=e184]: Place JavaScript or TypeScript files in the plugin directory.
            - list [ref=e185]:
              - listitem [ref=e186]:
                - code [ref=e187]: "`.opencode/plugins/`"
                - text: "- Project-level plugins"
              - listitem [ref=e188]:
                - code [ref=e189]: "`~/.config/opencode/plugins/`"
                - text: "- Global plugins"
            - paragraph [ref=e190]: Files in these directories are automatically loaded at startup.
            - separator [ref=e191]
            - heading "From npm" [level=3] [ref=e192]:
              - link "From npm" [ref=e193]:
                - /url: "#from-npm"
            - paragraph [ref=e194]: Specify npm packages in your config file.
            - figure "opencode.json" [ref=e196]:
              - generic [ref=e198]: opencode.json
              - code [ref=e200]:
                - generic [ref=e202]: "{"
                - generic [ref=e204]: "\"$schema\": \"https://opencode.ai/config.json\","
                - generic [ref=e206]: "\"plugin\": [\"opencode-helicone-session\", \"opencode-wakatime\", \"@my-org/custom-plugin\"]"
                - generic [ref=e208]: "}"
              - button "Copy to clipboard" [ref=e210] [cursor=pointer]
            - paragraph [ref=e212]: Both regular and scoped npm packages are supported.
            - paragraph [ref=e213]:
              - text: Browse available plugins in the
              - link "ecosystem" [ref=e214] [cursor=pointer]:
                - /url: /docs/ecosystem#plugins
              - text: .
            - separator [ref=e215]
            - heading "How plugins are installed" [level=3] [ref=e216]:
              - link "How plugins are installed" [ref=e217]:
                - /url: "#how-plugins-are-installed"
            - paragraph [ref=e218]:
              - strong [ref=e219]: npm plugins
              - text: are installed automatically using Bun at startup. Packages and their dependencies are cached in
              - code [ref=e220]: "`~/.cache/opencode/node_modules/`"
              - text: .
            - paragraph [ref=e221]:
              - strong [ref=e222]: Local plugins
              - text: are loaded directly from the plugin directory. To use external packages, you must create a
              - code [ref=e223]: "`package.json`"
              - text: within your config directory (see
              - link "Dependencies" [ref=e224] [cursor=pointer]:
                - /url: "#dependencies"
              - text: ), or publish the plugin to npm and
              - link "add it to your config" [ref=e225] [cursor=pointer]:
                - /url: /docs/config#plugins
              - text: .
            - separator [ref=e226]
            - heading "Load order" [level=3] [ref=e227]:
              - link "Load order" [ref=e228]:
                - /url: "#load-order"
            - paragraph [ref=e229]: "Plugins are loaded from all sources and all hooks run in sequence. The load order is:"
            - list [ref=e230]:
              - listitem [ref=e231]:
                - text: Global config (
                - code [ref=e232]: "`~/.config/opencode/opencode.json`"
                - text: )
              - listitem [ref=e233]:
                - text: Project config (
                - code [ref=e234]: "`opencode.json`"
                - text: )
              - listitem [ref=e235]:
                - text: Global plugin directory (
                - code [ref=e236]: "`~/.config/opencode/plugins/`"
                - text: )
              - listitem [ref=e237]:
                - text: Project plugin directory (
                - code [ref=e238]: "`.opencode/plugins/`"
                - text: )
            - paragraph [ref=e239]: Duplicate npm packages with the same name and version are loaded once. However, a local plugin and an npm plugin with similar names are both loaded separately.
            - separator [ref=e240]
            - heading "Create a plugin" [level=2] [ref=e241]:
              - link "Create a plugin" [ref=e242]:
                - /url: "#create-a-plugin"
            - paragraph [ref=e243]:
              - text: A plugin is a
              - strong [ref=e244]: JavaScript/TypeScript module
              - text: that exports one or more plugin functions. Each function receives a context object and returns a hooks object.
            - separator [ref=e245]
            - heading "Dependencies" [level=3] [ref=e246]:
              - link "Dependencies" [ref=e247]:
                - /url: "#dependencies"
            - paragraph [ref=e248]:
              - text: Local plugins and custom tools can use external npm packages. Add a
              - code [ref=e249]: "`package.json`"
              - text: to your config directory with the dependencies you need.
            - figure ".opencode/package.json" [ref=e251]:
              - generic [ref=e253]: .opencode/package.json
              - code [ref=e255]:
                - generic [ref=e257]: "{"
                - generic [ref=e259]: "\"dependencies\": {"
                - generic [ref=e261]: "\"shescape\": \"^2.1.0\""
                - generic [ref=e263]: "}"
                - generic [ref=e266]: "}"
              - button "Copy to clipboard" [ref=e268] [cursor=pointer]
            - paragraph [ref=e270]:
              - text: OpenCode runs
              - code [ref=e271]: "`bun install`"
              - text: at startup to install these. Your plugins and tools can then import them.
            - figure ".opencode/plugins/my-plugin.ts" [ref=e273]:
              - generic [ref=e275]: .opencode/plugins/my-plugin.ts
              - code [ref=e277]:
                - generic [ref=e279]: "import { escape } from \"shescape\""
                - generic [ref=e283]: "export const MyPlugin = async (ctx) => {"
                - generic [ref=e285]: "return {"
                - generic [ref=e287]: "\"tool.execute.before\": async (input, output) => {"
                - generic [ref=e289]: "if (input.tool === \"bash\") {"
                - generic [ref=e291]: output.args.command = escape(output.args.command)
                - generic [ref=e294]: "}"
                - generic [ref=e297]: "},"
                - generic [ref=e300]: "}"
                - generic [ref=e303]: "}"
              - button "Copy to clipboard" [ref=e305] [cursor=pointer]
            - separator [ref=e307]
            - heading "Basic structure" [level=3] [ref=e308]:
              - link "Basic structure" [ref=e309]:
                - /url: "#basic-structure"
            - figure ".opencode/plugins/example.js" [ref=e311]:
              - generic [ref=e313]: .opencode/plugins/example.js
              - code [ref=e315]:
                - generic [ref=e317]: "export const MyPlugin = async ({ project, client, $, directory, worktree }) => {"
                - generic [ref=e319]: console.log("Plugin initialized!")
                - generic [ref=e324]: "return {"
